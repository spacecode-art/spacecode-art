headline: >-
  Cloud infrastructure & DevSecOps engineer building Atlas — a ten-phase,
  production-grade platform, engineered end to end for $0 in cloud spend.

summary: >-
  Atlas is not a tutorial portfolio. It is one platform built in sequence —
  landing zone, security, observability, networking, resilience, platform
  engineering, FinOps, automation, AI-assisted ops, reference architectures —
  where every repository consumes the one before it. Every non-trivial decision
  is written down as an ADR, including the wrong turns. Every phase ships with a
  threat model, a cost model, and scan artifacts committed to the repo.

cloud_spend: "$0"

principles:
  - "**Production First** — if it wouldn't survive an audit, it isn't done"
  - "**Security by Default** — scanned in CI, never bolted on afterwards"
  - "**Everything as Code** — infra, policy, docs, changelog (this README included)"
  - "**Cost Aware** — every architecture decision carries a dollar figure"
  - "**Observable** — if you can't see it, you don't control it"

