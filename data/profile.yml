headline: >-
  Cloud infrastructure and DevSecOps engineer. I build Atlas, a platform
  covering landing zone, security, observability, networking, and the layers
  above them.

summary: >-
  Atlas is one platform built in sequence rather than a set of unrelated
  projects — each repository depends on the ones before it. Every repository
  carries an architecture diagram, a decision record for each non-trivial
  choice, a threat model, a cost model, and committed scan output.

approach: >-
  Development runs against local emulators, Docker, and local Kubernetes, with
  short burst deployments to real AWS where a design needs live validation.
  Each repository documents what its architecture would cost running
  continuously, separately from what it cost to build.

principles:
  - "Infrastructure, policy, and documentation are all version-controlled and reviewed"
  - "Security scanning runs in CI on every change rather than as a later pass"
  - "Cost is treated as an architecture constraint, with a figure attached to each decision"
  - "Decisions are recorded with their context and tradeoffs, including the ones that were reversed"

stack:
  Infrastructure: [Terraform, Terratest, AWS, MiniStack, Docker]
  Security: [Checkov, tfsec, Trivy, Semgrep, Gitleaks, Syft, Grype, Cosign, OPA/Conftest]
  Observability: [Prometheus, Grafana, Loki, Tempo, OpenTelemetry, Alertmanager]
  Platform: [Kubernetes, ArgoCD, Helm, GitHub Actions, Python, Bash]

