phases:
  - phase: 1
    name: Foundation
    repo: atlas-foundation
    status: shipped
    proves: >-
      Multi-account AWS Organization with IAM Identity Center and SCP guardrails
      as code, reusable Terraform modules tested with Terratest, and a
      plan-only CI gate.
    adrs: 21
    demo: https://asciinema.org/a/IgoRlFyJlLNEODre

  - phase: 2
    name: Security
    repo: atlas-security
    status: shipped
    proves: >-
      Policy-as-code and security scanning are delivered as shared,
      version-pinned reusable workflows consumed by the other Atlas
      repositories.
    adrs: 10
    demo: https://asciinema.org/a/JzsLR4EylHwFOxA9

  - phase: 3
    name: Observability
    repo: atlas-observability
    status: shipped
    proves: >-
      Self-hosted LGTM stack and OpenTelemetry instrumentation on a real
      application, with Golden Signals dashboards built from real traffic.
    adrs: 4
    demo: https://youtu.be/RTcdDzRZSoA

  - phase: 4
    name: Networking
    repo: atlas-network
    status: shipped
    proves: >-
      Hub-and-spoke Transit Gateway with per-spoke route tables, PrivateLink in
      place of VPC peering for service exposure, and a per-environment NAT cost
      strategy. Validated on real AWS in a timed burst deployment, then torn
      down.
    adrs: 11
    demo: https://drive.google.com/file/d/1yjww9BCNU8GPGmnQmeDtHjTMlDnftsHp/view

  - phase: 5
    name: Resilience
    repo: atlas-resilience
    status: active
    proves: >-
      Chaos engineering with Chaos Mesh against a local kind cluster, a
      recorded Game Day, measured RTO/RPO, and blameless postmortems.
    adrs: 4

  - phase: 6
    name: Platform Engineering
    repo: atlas-platform
    status: planned
    proves: >-
      A GitOps golden path with ArgoCD and Helm, and a single-command
      application deploy.

  - phase: 7
    name: FinOps
    repo: atlas-finops
    status: planned
    proves: >-
      A CUR analysis pipeline and cost-optimization recommendation engine,
      using billing data from the Atlas burst deployments, with any synthetic
      data clearly labelled.

  - phase: 8
    name: Automation
    repo: atlas-automation
    status: planned
    proves: >-
      A CLI tool for drift detection, orphaned-resource cleanup, and ChatOps
      alerting.

  - phase: 9
    name: AI-Assisted Ops
    repo: atlas-ai
    status: planned
    proves: >-
      A Terraform change reviewer, incident-response assistant, and cost
      advisor, running on local open-weight models against the platform's own
      artifacts.

  - phase: 10
    name: Reference Architectures
    repo: atlas-reference-architectures
    status: planned
    proves: >-
      Reference stacks synthesized from Phases 1–9: architecture, Terraform,
      threat model, cost model, and deployment guide.